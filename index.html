<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notowania – Strona główna</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #222;
    }
    h1 {
      margin-bottom: 8px;
    }
    .opis {
      color: #555;
      margin-bottom: 32px;
    }
    .lata {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }
    .lata a {
      display: block;
      padding: 14px 10px;
      text-align: center;
      text-decoration: none;
      color: #111;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .lata a:hover {
      background: #e8e8e8;
      border-color: #bbb;
    }
  </style>
</head>
<body>

  <h1>Notowania</h1>
  <p class="opis">Wybierz rok, aby zobaczyć dostępne notowania.</p>

    <a href="1996.html">1996</a>
    <a href="1997.html">1997</a>
    <a href="1998.html">1998</a>
    <a href="1999.html">1999</a>
    <a href="2000.html">2000</a>
    <a href="2001.html">2001</a>
    <a href="2002.html">2002</a>
    <a href="2003.html">2003</a>
    <a href="2004.html">2004</a>
    <a href="2005.html">2005</a>
    <a href="2006.html">2006</a>
  </div>

</body>
</html>
